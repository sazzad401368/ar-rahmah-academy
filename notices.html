```html
<!DOCTYPE html>
<html lang="bn">

  <style>

    .delete-btn {

    .empty {
      background: white;

    #status {

        transform: rotate(360deg);
      }

      }

        flex-direction: column;

      }
    }
  </style>
</head>

<body>

  <!-- Loading -->
  <div id="loading">
    <div class="loader">
      <div class="spinner"></div>
      <p>Admin যাচাই করা হচ্ছে...</p>
    </div>
  </div>

  <!-- Header -->
  <header>
    <h1>📢 Notice Management</h1>
    <p>আর রহমাহ ইন্টারন্যাশনাল নূরানী একাডেমি</p>
  </header>

  <main class="container">

    <!-- Top Buttons -->
    <div class="top-bar">

      <button
        class="back-btn"
        onclick="goDashboard()">
        ← Admin Dashboard
      </button>

      <button
        class="add-btn"
        onclick="showAddForm()">
        ➕ নতুন নোটিশ
      </button>

    </div>

    <!-- Status -->
    <div id="status"></div>

    <!-- Form -->
    <section
      id="formBox"
      class="form-box">

      <h2 id="formTitle">
        ➕ নতুন নোটিশ যোগ করুন
      </h2>

      <input
        type="hidden"
        id="noticeId">

      <div class="form-group">

        <label for="title">
          📌 নোটিশের শিরোনাম
        </label>

        <input
          type="text"
          id="title"
          placeholder="নোটিশের শিরোনাম লিখুন">

      </div>

      <div class="form-group">

        <label for="detail">
          📝 নোটিশের বিস্তারিত
        </label>

        <textarea
          id="detail"
          placeholder="নোটিশের বিস্তারিত লিখুন"></textarea>

      </div>

      <div class="publish-row">

        <input
          type="checkbox"
          id="published"
          checked>

        <label for="published">
          ✅ নোটিশটি প্রকাশ করুন
        </label>

      </div>

      <div class="form-buttons">

        <button
          class="save-btn"
          onclick="saveNotice()">
          💾 সংরক্ষণ করুন
        </button>

        <button
          class="cancel-btn"
          onclick="hideForm()">
          বাতিল
        </button>

      </div>

    </section>

    <!-- Notices -->
    <h2 class="section-title">
      📋 সকল নোটিশ
    </h2>

    <section
      id="noticeList"
      class="notice-list">
    </section>

  </main>


  <script>

    /* ===============================
       SUPABASE
    =============================== */

    const SUPABASE_URL =
      "https://pkznaencgprqzvdzapfi.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable__kretQlB4kdzQp7pyi4opg_Xlf0qsON";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ===============================
       ADMIN CHECK
    =============================== */

    async function checkAdmin() {

      try {

        const {
          data: { user },
          error
        } =
          await supabaseClient.auth.getUser();

        if (error || !user) {

          window.location.href =
            "index.html#admin-login";

          return false;
        }


        const {
          data: adminData,
          error: adminError
        } =
          await supabaseClient
            .from("admins")
            .select("id")
            .eq("id", user.id)
            .maybeSingle();


        if (adminError || !adminData) {

          await supabaseClient.auth.signOut();

          window.location.href =
            "index.html#admin-login";

          return false;
        }


        return true;

      } catch (error) {

        console.error(error);

        window.location.href =
          "index.html#admin-login";

        return false;
      }
    }


    /* ===============================
       STATUS
    =============================== */

    function showStatus(message, type) {

      const status =
        document.getElementById("status");

      status.textContent = message;

      status.className =
        type === "error"
          ? "error"
          : "success";

      setTimeout(() => {
        status.className = "";
        status.textContent = "";
      }, 3500);
    }


    /* ===============================
       LOAD NOTICES
    =============================== */

    async function loadNotices() {

      const list =
        document.getElementById("noticeList");

      list.innerHTML =
        '<div class="empty">⏳ নোটিশ লোড হচ্ছে...</div>';


      const {
        data,
        error
      } =
        await supabaseClient
          .from("notices")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(error);

        list.innerHTML =
          '<div class="empty">⚠️ নোটিশ লোড করা যায়নি।</div>';

        showStatus(
          "নোটিশ লোড করতে সমস্যা হয়েছে।",
          "error"
        );

        return;
      }


      if (!data || data.length === 0) {

        list.innerHTML =
          '<div class="empty">📭 এখনো কোনো নোটিশ নেই।</div>';

        return;
      }


      list.innerHTML =
        data.map(notice => {

          const date =
            notice.created_at
              ? new Date(notice.created_at)
                  .toLocaleDateString(
                    "bn-BD",
                    {
                      year: "numeric",
                      month: "long",
                      day: "numeric"
                    }
                  )
              : "";


          return `

            <article class="notice-card">

              <div class="notice-header">

                <div class="notice-title">
                  ${escapeHtml(notice.title || "")}
                </div>

                <span class="
                  badge
                  ${notice.published
                    ? "published"
                    : "unpublished"}
                ">
                  ${notice.published
                    ? "প্রকাশিত"
                    : "অপ্রকাশিত"}
                </span>

              </div>


              <div class="notice-detail">
                ${escapeHtml(notice.detail || "")}
              </div>


              <div class="notice-date">
                📅 ${date}
              </div>


              <div class="actions">

                <button
                  class="action-btn edit-btn"
                  onclick="editNotice(${notice.id})">
                  ✏️ Edit
                </button>

                <button
                  class="action-btn toggle-btn"
                  onclick="togglePublished(
                    ${notice.id},
                    ${notice.published}
                  )">
                  ${notice.published
                    ? "🙈 Unpublish"
                    : "✅ Publish"}
                </button>

                <button
                  class="action-btn delete-btn"
                  onclick="deleteNotice(${notice.id})">
                  🗑️ Delete
                </button>

              </div>

            </article>

          `;

        }).join("");

    }


    /* ===============================
       ADD FORM
    =============================== */

    function showAddForm() {

      document.getElementById(
        "formBox"
      ).classList.add("show");

      document.getElementById(
        "formTitle"
      ).textContent =
        "➕ নতুন নোটিশ যোগ করুন";

      document.getElementById(
        "noticeId"
      ).value = "";

      document.getElementById(
        "title"
      ).value = "";

      document.getElementById(
        "detail"
      ).value = "";

      document.getElementById(
        "published"
      ).checked = true;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* ===============================
       HIDE FORM
    =============================== */

    function hideForm() {

      document.getElementById(
        "formBox"
      ).classList.remove("show");

    }


    /* ===============================
       SAVE / UPDATE
    =============================== */

    async function saveNotice() {

      const id =
        document.getElementById(
          "noticeId"
        ).value;

      const title =
        document.getElementById(
          "title"
        ).value.trim();

      const detail =
        document.getElementById(
          "detail"
        ).value.trim();

      const published =
        document.getElementById(
          "published"
        ).checked;


      if (!title) {

        showStatus(
          "⚠️ নোটিশের শিরোনাম লিখুন।",
          "error"
        );

        return;
      }


      if (!detail) {

        showStatus(
          "⚠️ নোটিশের বিস্তারিত লিখুন।",
          "error"
        );

        return;
      }


      try {

        if (id) {

          /* UPDATE */

          const {
            error
          } =
            await supabaseClient
              .from("notices")
              .update({
                title: title,
                detail: detail,
                published: published
              })
              .eq("id", id);


          if (error) {
            throw error;
          }


          showStatus(
            "✅ নোটিশ সফলভাবে আপডেট হয়েছে।"
          );

        } else {

          /* INSERT */

          const {
            error
          } =
            await supabaseClient
              .from("notices")
              .insert({
                title: title,
                detail: detail,
                published: published
              });


          if (error) {
            throw error;
          }


          showStatus(
            "✅ নতুন নোটিশ সফলভাবে যোগ হয়েছে।"
          );

        }


        hideForm();

        await loadNotices();

      } catch (error) {

        console.error(error);

        showStatus(
          "❌ নোটিশ সংরক্ষণ করা যায়নি।",
          "error"
        );

      }

    }


    /* ===============================
       EDIT
    =============================== */

    async function editNotice(id) {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("notices")
          .select("*")
          .eq("id", id)
          .maybeSingle();


      if (error || !data) {

        showStatus(
          "নোটিশের তথ্য পাওয়া যায়নি।",
          "error"
        );

        return;
      }


      document.getElementById(
        "noticeId"
      ).value = data.id;

      document.getElementById(
        "title"
      ).value = data.title || "";

      document.getElementById(
        "detail"
      ).value = data.detail || "";

      document.getElementById(
        "published"
      ).checked = !!data.published;

      document.getElementById(
        "formTitle"
      ).textContent =
        "✏️ নোটিশ পরিবর্তন করুন";

      document.getElementById(
        "formBox"
      ).classList.add("show");


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* ===============================
       DELETE
    =============================== */

    async function deleteNotice(id) {

      const confirmed =
        confirm(
          "আপনি কি এই নোটিশটি মুছে ফেলতে চান?"
        );


      if (!confirmed) {
        return;
      }


      const {
        error
      } =
        await supabaseClient
          .from("notices")
          .delete()
          .eq("id", id);


      if (error) {

        console.error(error);

        showStatus(
          "❌ নোটিশ মুছে ফেলা যায়নি।",
          "error"
        );

        return;
      }


      showStatus(
        "🗑️ নোটিশ সফলভাবে মুছে ফেলা হয়েছে।"
      );

      await loadNotices();

    }


    /* ===============================
       PUBLISH / UNPUBLISH
    =============================== */

    async function togglePublished(
      id,
      currentStatus
    ) {

      const {
        error
      } =
        await supabaseClient
          .from("notices")
          .update({
            published: !currentStatus
          })
          .eq("id", id);


      if (error) {

        console.error(error);

        showStatus(
          "নোটিশের প্রকাশনা পরিবর্তন করা যায়নি।",
          "error"
        );

        return;
      }


      showStatus(
        currentStatus
          ? "🙈 নোটিশ Unpublish করা হয়েছে।"
          : "✅ নোটিশ Publish করা হয়েছে।"
      );

      await loadNotices();

    }


    /* ===============================
       HTML SECURITY
    =============================== */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ===============================
       DASHBOARD
    =============================== */

    function goDashboard() {

      window.location.href =
        "admin.html";

    }


    /* ===============================
       INITIALIZE
    =============================== */

    async function initialize() {

      const isAdmin =
        await checkAdmin();


      if (!isAdmin) {
        return;
      }


      await loadNotices();


      document.getElementById(
        "loading"
      ).style.display = "none";

    }


    initialize();

  </script>

</body>
</html>
```
