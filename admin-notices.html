<!DOCTYPE html>

<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Notice Management | Ar-Rahmah Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #087443;
      --dark: #055c35;
      --bg: #f4f7f6;
      --white: #ffffff;
      --text: #222222;
      --muted: #6b7280;
      --danger: #c62828;
      --blue: #2563eb;
      --orange: #d97706;
      --border: #d1d5db;
    }

    body {
      font-family:
        "Noto Sans Bengali",
        "Hind Siliguri",
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* ==============================
       HEADER
    ============================== */

    header {
      background: linear-gradient(
        135deg,
        var(--primary),
        var(--dark)
      );
      color: white;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    header h1 {
      font-size: 27px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
      opacity: .92;
    }

    /* ==============================
       CONTAINER
    ============================== */

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px 50px;
    }

    /* ==============================
       TOP BAR
    ============================== */

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 15px;
      font-family: inherit;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .back-btn {
      background: white;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .back-btn:hover {
      background: #eef8f3;
    }

    .add-btn {
      background: var(--primary);
      color: white;
    }

    .add-btn:hover {
      background: var(--dark);
    }

    /* ==============================
       STATUS
    ============================== */

    #status {
      display: none;
      padding: 13px 15px;
      margin-bottom: 18px;
      text-align: center;
      border-radius: 9px;
      font-weight: bold;
      line-height: 1.6;
      word-break: break-word;
    }

    .success {
      display: block !important;
      background: #e8f7ee;
      color: var(--primary);
      border: 1px solid #b9e5cb;
    }

    .error {
      display: block !important;
      background: #fdecec;
      color: var(--danger);
      border: 1px solid #f3bcbc;
    }

    /* ==============================
       FORM
    ============================== */

    .form-box {
      display: none;
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
    }

    .form-box.show {
      display: block;
    }

    .form-box h2 {
      color: var(--primary);
      margin-bottom: 20px;
      font-size: 21px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      font-family: inherit;
      background: white;
    }

    .form-group textarea {
      min-height: 150px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--primary);
      box-shadow:
        0 0 0 3px rgba(8,116,67,.10);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .save-btn {
      background: var(--primary);
      color: white;
    }

    .save-btn:hover {
      background: var(--dark);
    }

    .cancel-btn {
      background: #e5e7eb;
      color: #374151;
    }

    /* ==============================
       SEARCH
    ============================== */

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .search-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    /* ==============================
       SECTION TITLE
    ============================== */

    .section-title {
      color: var(--primary);
      margin: 25px 0 15px;
      font-size: 22px;
    }

    /* ==============================
       NOTICE LIST
    ============================== */

    .notice-list {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }

    .notice-card {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
      transition: .2s;
      border-left: 5px solid var(--primary);
    }

    .notice-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 22px rgba(0,0,0,.10);
    }

    .notice-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .notice-title {
      color: var(--primary);
      font-size: 20px;
      font-weight: bold;
      word-break: break-word;
    }

    .status-badge {
      flex-shrink: 0;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .published {
      background: #e8f7ee;
      color: var(--primary);
    }

    .unpublished {
      background: #fff4e5;
      color: var(--orange);
    }

    .notice-detail {
      color: #555;
      white-space: pre-line;
      word-break: break-word;
      margin-bottom: 14px;
    }

    .notice-date {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .notice-id {
      color: #9ca3af;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: none;
      border-radius: 7px;
      padding: 8px 13px;
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }

    .edit-btn {
      background: var(--blue);
    }

    .edit-btn:hover {
      background: #1d4ed8;
    }

    .toggle-btn {
      background: var(--orange);
    }

    .toggle-btn:hover {
      background: #b45309;
    }

    .delete-btn {
      background: var(--danger);
    }

    .delete-btn:hover {
      background: #a61b1b;
    }

    /* ==============================
       EMPTY
    ============================== */

    .empty {
      background: white;
      padding: 40px 20px;
      text-align: center;
      border-radius: 15px;
      color: var(--muted);
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
      grid-column: 1 / -1;
    }

    /* ==============================
       LOADING
    ============================== */

    #loading {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.97);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loader {
      text-align: center;
      color: var(--primary);
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #dcefe5;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: auto auto 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 600px) {

      header h1 {
        font-size: 22px;
      }

      .container {
        margin-top: 18px;
      }

      .form-box {
        padding: 18px;
      }

      .notice-list {
        grid-template-columns: 1fr;
      }

      .notice-top {
        flex-direction: column;
      }

      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .top-bar .btn {
        width: 100%;
      }

    }
  </style>

</head>

  </main>

  <script>

    /* ===================================
       SUPABASE
    =================================== */

    const SUPABASE_URL =
      "https://pkznaencgprqzvdzapfi.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable__kretQlB4kdzQp7pyi4opg_Xlf0qsON";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let notices = [];


    /* ===================================
       ADMIN CHECK
    =================================== */

    async function checkAdmin() {

      try {

        const {
          data: { user },
          error
        } =
          await supabaseClient.auth.getUser();


        if (error || !user) {

          window.location.href =
            "index.html#admin-login";

          return false;

        }


        const {
          data: adminData,
          error: adminError
        } =
          await supabaseClient
            .from("admins")
            .select("id")
            .eq("id", user.id)
            .maybeSingle();


        if (adminError || !adminData) {

          console.error(
            "ADMIN CHECK ERROR:",
            adminError
          );

          await supabaseClient.auth.signOut();

          window.location.href =
            "index.html#admin-login";

          return false;

        }


        return true;

      } catch (error) {

        console.error(
          "ADMIN CHECK ERROR:",
          error
        );

        window.location.href =
          "index.html#admin-login";

        return false;

      }

    }


    /* ===================================
       STATUS MESSAGE
    =================================== */

    function showStatus(
      message,
      type = "success"
    ) {

      const status =
        document.getElementById("status");


      status.textContent =
        message;


      status.className =
        type === "error"
          ? "error"
          : "success";


      setTimeout(() => {

        status.textContent = "";

        status.className = "";

      }, 5000);

    }


    /* ===================================
       LOAD NOTICES
    =================================== */

    async function loadNotices() {

      const list =
        document.getElementById(
          "noticeList"
        );


      list.innerHTML =
        '<div class="empty">⏳ নোটিশ লোড হচ্ছে...</div>';


      const {
        data,
        error
      } =
        await supabaseClient
          .from("notices")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(
          "LOAD NOTICES ERROR:",
          error
        );


        list.innerHTML =
          '<div class="empty">⚠️ নোটিশ লোড করা যায়নি।</div>';


        showStatus(
          "❌ নোটিশ লোড করতে সমস্যা হয়েছে: " +
          (
            error.message ||
            "Unknown error"
          ),
          "error"
        );


        return;

      }


      notices =
        data || [];


      renderNotices(
        notices
      );

    }


    /* ===================================
       RENDER NOTICES
    =================================== */

    function renderNotices(list) {

      const container =
        document.getElementById(
          "noticeList"
        );


      if (!list.length) {

        container.innerHTML =
          '<div class="empty">📢 কোনো নোটিশ পাওয়া যায়নি।</div>';

        return;

      }


      container.innerHTML =
        list.map(notice => {

          const title =
            notice.title ||
            "নোটিশ";


          const detail =
            notice.detail ||
            "বিস্তারিত তথ্য নেই।";


          const date =
            notice.created_at
              ? new Date(
                  notice.created_at
                ).toLocaleDateString(
                  "bn-BD",
                  {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                  }
                )
              : "তারিখ নেই";


          const isPublished =
            notice.published === true;


          return `

            <article
              class="notice-card">

              <div
                class="notice-top">

                <div
                  class="notice-title">

                  ${escapeHtml(title)}

                </div>


                <span
                  class="status-badge ${
                    isPublished
                      ? "published"
                      : "unpublished"
                  }">

                  ${
                    isPublished
                      ? "✅ প্রকাশিত"
                      : "⏸️ প্রকাশিত নয়"
                  }

                </span>

              </div>


              <div
                class="notice-detail">

                ${escapeHtml(detail)}

              </div>


              <div
                class="notice-id">

                🆔 Notice ID:
                ${escapeHtml(notice.id)}

              </div>


              <div
                class="notice-date">

                📅 ${date}

              </div>


              <div
                class="actions">


                <button
                  class="action-btn edit-btn"
                  onclick="editNotice(${Number(notice.id)})">

                  ✏️ Edit

                </button>


                <button
                  class="action-btn toggle-btn"
                  onclick="togglePublished(${Number(notice.id)})">

                  ${
                    isPublished
                      ? "⏸️ Unpublish"
                      : "📢 Publish"
                  }

                </button>


                <button
                  class="action-btn delete-btn"
                  onclick="deleteNotice(${Number(notice.id)})">

                  🗑️ Delete

                </button>


              </div>

            </article>

          `;

        }).join("");

    }


    /* ===================================
       SEARCH
    =================================== */

    function filterNotices() {

      const query =
        document.getElementById(
          "search"
        ).value
          .trim()
          .toLowerCase();


      if (!query) {

        renderNotices(
          notices
        );

        return;

      }


      const filtered =
        notices.filter(
          notice => {

            const title =
              String(
                notice.title || ""
              ).toLowerCase();


            const detail =
              String(
                notice.detail || ""
              ).toLowerCase();


            return (
              title.includes(query) ||
              detail.includes(query)
            );

          }
        );


      renderNotices(
        filtered
      );

    }


    /* ===================================
       SHOW ADD FORM
    =================================== */

    function showAddForm() {

      document.getElementById(
        "formBox"
      ).classList.add("show");


      document.getElementById(
        "formTitle"
      ).textContent =
        "➕ নতুন নোটিশ যোগ করুন";


      document.getElementById(
        "noticeId"
      ).value = "";


      document.getElementById(
        "title"
      ).value = "";


      document.getElementById(
        "detail"
      ).value = "";


      document.getElementById(
        "published"
      ).value = "true";


      document.getElementById(
        "saveButton"
      ).textContent =
        "💾 নোটিশ সংরক্ষণ করুন";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* ===================================
       HIDE FORM
    =================================== */

    function hideForm() {

      document.getElementById(
        "formBox"
      ).classList.remove(
        "show"
      );

    }


    /* ===================================
       SAVE NOTICE
    =================================== */

    async function saveNotice() {

      const id =
        document.getElementById(
          "noticeId"
        ).value.trim();


      const title =
        document.getElementById(
          "title"
        ).value.trim();


      const detail =
        document.getElementById(
          "detail"
        ).value.trim();


      const published =
        document.getElementById(
          "published"
        ).value === "true";


      /* =============================
         VALIDATION
      ============================= */

      if (!title) {

        showStatus(
          "⚠️ নোটিশের শিরোনাম লিখুন।",
          "error"
        );

        return;

      }


      if (!detail) {

        showStatus(
          "⚠️ নোটিশের বিস্তারিত লিখুন।",
          "error"
        );

        return;

      }


      const saveButton =
        document.getElementById(
          "saveButton"
        );


      saveButton.disabled = true;

      saveButton.textContent =
        "⏳ সংরক্ষণ হচ্ছে...";


      try {

        /* =============================
           UPDATE
        ============================= */

        if (id) {

          const {
            error
          } =
            await supabaseClient
              .from("notices")
              .update({
                title: title,
                detail: detail,
                published: published
              })
              .eq(
                "id",
                Number(id)
              );


          if (error) {

            throw error;

          }


          showStatus(
            "✅ নোটিশ সফলভাবে আপডেট হয়েছে।"
          );

        }


        /* =============================
           INSERT
           
           IMPORTANT:
           এখানে id পাঠানো হচ্ছে না।
           Supabase Identity column
           নিজে ID তৈরি করবে।
        ============================= */

        else {

          const {
            error
          } =
            await supabaseClient
              .from("notices")
              .insert({
                title: title,
                detail: detail,
                published: published
              });


          if (error) {

            throw error;

          }


          showStatus(
            "✅ নতুন নোটিশ সফলভাবে যোগ হয়েছে।"
          );

        }


        hideForm();


        await loadNotices();


      } catch (error) {

        console.error(
          "NOTICE SAVE ERROR:",
          error
        );


        showStatus(
          "❌ নোটিশ সংরক্ষণ করা যায়নি: " +
          (
            error.message ||
            "Unknown error"
          ),
          "error"
        );

      } finally {

        saveButton.disabled = false;

        saveButton.textContent =
          "💾 নোটিশ সংরক্ষণ করুন";

      }

    }


    /* ===================================
       EDIT NOTICE
    =================================== */

    async function editNotice(id) {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("notices")
          .select("*")
          .eq("id", id)
          .maybeSingle();


      if (error || !data) {

        console.error(
          "EDIT NOTICE ERROR:",
          error
        );


        showStatus(
          "❌ নোটিশের তথ্য পাওয়া যায়নি।",
          "error"
        );


        return;

      }


      document.getElementById(
        "noticeId"
      ).value =
        data.id || "";


      document.getElementById(
        "title"
      ).value =
        data.title || "";


      document.getElementById(
        "detail"
      ).value =
        data.detail || "";


      document.getElementById(
        "published"
      ).value =
        data.published === true
          ? "true"
          : "false";


      document.getElementById(
        "formTitle"
      ).textContent =
        "✏️ নোটিশ পরিবর্তন করুন";


      document.getElementById(
        "saveButton"
      ).textContent =
        "💾 পরিবর্তন সংরক্ষণ করুন";


      document.getElementById(
        "formBox"
      ).classList.add("show");


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* ===================================
       TOGGLE PUBLISHED
    =================================== */

    async function togglePublished(id) {

      const notice =
        notices.find(
          item =>
            Number(item.id) === Number(id)
        );


      if (!notice) {

        showStatus(
          "❌ নোটিশ পাওয়া যায়নি।",
          "error"
        );

        return;

      }


      const newStatus =
        notice.published !== true;


      try {

        const {
          error
        } =
          await supabaseClient
            .from("notices")
            .update({
              published: newStatus
            })
            .eq(
              "id",
              Number(id)
            );


        if (error) {

          throw error;

        }


        showStatus(
          newStatus
            ? "📢 নোটিশ প্রকাশিত হয়েছে।"
            : "⏸️ নোটিশ Unpublish করা হয়েছে।"
        );


        await loadNotices();


      } catch (error) {

        console.error(
          "TOGGLE NOTICE ERROR:",
          error
        );


        showStatus(
          "❌ নোটিশের প্রকাশের অবস্থা পরিবর্তন করা যায়নি: " +
          (
            error.message ||
            "Unknown error"
          ),
          "error"
        );

      }

    }


    /* ===================================
       DELETE NOTICE
    =================================== */

    async function deleteNotice(id) {

      const notice =
        notices.find(
          item =>
            Number(item.id) === Number(id)
        );


      const title =
        notice?.title ||
        "এই নোটিশ";


      const confirmed =
        confirm(
          "আপনি কি \"" +
          title +
          "\" নোটিশটি মুছে ফেলতে চান?"
        );


      if (!confirmed) {

        return;

      }


      try {

        const {
          error
        } =
          await supabaseClient
            .from("notices")
            .delete()
            .eq(
              "id",
              Number(id)
            );


        if (error) {

          throw error;

        }


        showStatus(
          "🗑️ নোটিশ সফলভাবে মুছে ফেলা হয়েছে।"
        );


        await loadNotices();


      } catch (error) {

        console.error(
          "DELETE NOTICE ERROR:",
          error
        );


        showStatus(
          "❌ নোটিশ মুছে ফেলা যায়নি: " +
          (
            error.message ||
            "Unknown error"
          ),
          "error"
        );

      }

    }


    /* ===================================
       HTML SECURITY
    =================================== */

    function escapeHtml(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ===================================
       DASHBOARD
    =================================== */

    function goDashboard() {

      window.location.href =
        "admin.html";

    }


    /* ===================================
       INITIALIZE
    =================================== */

    async function initialize() {

      const isAdmin =
        await checkAdmin();


      if (!isAdmin) {

        return;

      }


      await loadNotices();


      document.getElementById(
        "loading"
      ).style.display =
        "none";

    }


    /* ===================================
       START
    =================================== */

    initialize();

  </script>
