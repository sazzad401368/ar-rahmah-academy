```html
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Teacher Management | Ar-Rahmah Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #087443;
      --dark: #055c35;
      --bg: #f4f7f6;
      --white: #ffffff;
      --text: #222222;
      --muted: #6b7280;
      --danger: #c62828;
      --blue: #2563eb;
      --border: #d1d5db;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
    }

    body {
      font-family:
        "Noto Sans Bengali",
        "Hind Siliguri",
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    /* ===============================
       HEADER
    =============================== */

    header {
      background: linear-gradient(
        135deg,
        var(--primary),
        var(--dark)
      );

      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 26px;
      margin-bottom: 7px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    /* ===============================
       CONTAINER
    =============================== */

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px 50px;
    }

    /* ===============================
       TOP BAR
    =============================== */

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 15px;
      font-family: inherit;
      transition: 0.2s;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back-btn {
      background: white;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .back-btn:hover {
      background: #e8f7ee;
    }

    .add-btn {
      background: var(--primary);
      color: white;
    }

    .add-btn:hover {
      background: var(--dark);
    }

    /* ===============================
       STATUS
    =============================== */

    #status {
      display: none;
      padding: 13px 15px;
      margin-bottom: 18px;
      text-align: center;
      border-radius: 9px;
      font-weight: bold;
      line-height: 1.6;
      word-break: break-word;
    }

    #status.success {
      display: block;
      background: #e8f7ee;
      color: var(--primary);
      border: 1px solid #b7e4c7;
    }

    #status.error {
      display: block;
      background: #fdecec;
      color: var(--danger);
      border: 1px solid #f3b7b7;
    }

    #status.info {
      display: block;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    /* ===============================
       FORM
    =============================== */

    .form-box {
      display: none;
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: var(--shadow);
    }

    .form-box.show {
      display: block;
    }

    .form-box h2 {
      color: var(--primary);
      margin-bottom: 20px;
      font-size: 21px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      font-family: inherit;
      transition: 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow:
        0 0 0 3px rgba(8, 116, 67, 0.1);
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .save-btn {
      background: var(--primary);
      color: white;
    }

    .save-btn:hover {
      background: var(--dark);
    }

    .cancel-btn {
      background: #e5e7eb;
      color: #374151;
    }

    .cancel-btn:hover {
      background: #d1d5db;
    }

    /* ===============================
       SEARCH
    =============================== */

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .search-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow:
        0 0 0 3px rgba(8, 116, 67, 0.1);
    }

    /* ===============================
       SECTION TITLE
    =============================== */

    .section-title {
      color: var(--primary);
      margin: 25px 0 15px;
    }

    /* ===============================
       TEACHER LIST
    =============================== */

    .teacher-list {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    /* ===============================
       TEACHER CARD
    =============================== */

    .teacher-card {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: var(--shadow);
      transition: 0.2s;
    }

    .teacher-card:hover {
      transform: translateY(-3px);
      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.1);
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #e8f7ee;
      color: var(--primary);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 29px;
      font-weight: bold;

      margin-bottom: 14px;
    }

    .teacher-name {
      color: var(--primary);
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .teacher-info {
      color: #555;
      margin-bottom: 7px;
      line-height: 1.6;
    }

    .teacher-date {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 15px;
    }

    /* ===============================
       ACTION BUTTONS
    =============================== */

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: none;
      border-radius: 7px;
      padding: 8px 13px;
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }

    .edit-btn {
      background: var(--blue);
    }

    .edit-btn:hover {
      background: #1d4ed8;
    }

    .delete-btn {
      background: var(--danger);
    }

    .delete-btn:hover {
      background: #a91f1f;
    }

    /* ===============================
       EMPTY
    =============================== */

    .empty {
      background: white;
      padding: 35px 20px;
      text-align: center;
      border-radius: 15px;
      color: var(--muted);
      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.06);

      grid-column: 1 / -1;
    }

    /* ===============================
       LOADING SCREEN
    =============================== */

    #loading {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.97);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 9999;
    }

    .loader {
      text-align: center;
      color: var(--primary);
    }

    .spinner {
      width: 45px;
      height: 45px;

      border: 4px solid #dcefe5;
      border-top-color: var(--primary);

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      margin:
        auto auto 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ===============================
       MOBILE
    =============================== */

    @media (max-width: 600px) {

      header h1 {
        font-size: 21px;
      }

      .container {
        margin-top: 18px;
      }

      .form-box {
        padding: 18px;
      }

      .teacher-list {
        grid-template-columns: 1fr;
      }

      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .top-bar .btn {
        width: 100%;
      }

    }
  </style>
</head>

<body>

  <!-- =============================
       LOADING
  ============================== -->

  <div id="loading">

    <div class="loader">

      <div class="spinner"></div>

      <p>
        Admin যাচাই করা হচ্ছে...
      </p>

    </div>

  </div>


  <!-- =============================
       HEADER
  ============================== -->

  <header>

    <h1>
      👨‍🏫 Teacher Management
    </h1>

    <p>
      আর রহমাহ ইন্টারন্যাশনাল নূরানী একাডেমি
    </p>

  </header>


  <main class="container">

    <!-- =============================
         TOP BAR
    ============================== -->

    <div class="top-bar">

      <button
        type="button"
        class="btn back-btn"
        onclick="goDashboard()">

        ← Admin Dashboard

      </button>


      <button
        type="button"
        class="btn add-btn"
        onclick="showAddForm()">

        ➕ নতুন শিক্ষক

      </button>

    </div>


    <!-- =============================
         STATUS
    ============================== -->

    <div id="status"></div>


    <!-- =============================
         FORM
    ============================== -->

    <section
      id="formBox"
      class="form-box">

      <h2 id="formTitle">
        ➕ নতুন শিক্ষক যোগ করুন
      </h2>


      <!--
        গুরুত্বপূর্ণ:
        teacherId শুধুমাত্র EDIT-এর জন্য ব্যবহার হবে।
        নতুন শিক্ষক যোগ করার সময় ID পাঠানো হবে না।
      -->

      <input
        type="hidden"
        id="teacherId">


      <div class="form-group">

        <label for="name">
          👤 শিক্ষকের নাম
        </label>

        <input
          type="text"
          id="name"
          placeholder="শিক্ষকের নাম লিখুন"
          autocomplete="name">

      </div>


      <div class="form-group">

        <label for="designation">
          🎓 পদবি
        </label>

        <input
          type="text"
          id="designation"
          placeholder="যেমন: প্রধান শিক্ষক">

      </div>


      <div class="form-group">

        <label for="phone">
          📱 মোবাইল নম্বর
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="মোবাইল নম্বর লিখুন"
          autocomplete="tel">

      </div>


      <div class="form-actions">

        <button
          type="button"
          id="saveButton"
          class="btn save-btn"
          onclick="saveTeacher()">

          💾 সংরক্ষণ করুন

        </button>


        <button
          type="button"
          class="btn cancel-btn"
          onclick="hideForm()">

          বাতিল

        </button>

      </div>

    </section>


    <!-- =============================
         SEARCH
    ============================== -->

    <div class="search-box">

      <input
        type="search"
        id="search"
        placeholder="🔎 শিক্ষকের নাম, পদবি বা মোবাইল দিয়ে খুঁজুন..."
        oninput="filterTeachers()">

    </div>


    <!-- =============================
         TITLE
    ============================== -->

    <h2 class="section-title">
      📋 সকল শিক্ষক
    </h2>


    <!-- =============================
         TEACHER LIST
    ============================== -->

    <section
      id="teacherList"
      class="teacher-list">
    </section>

  </main>


  <script>

    /* =====================================================
       SUPABASE CONFIGURATION
    ===================================================== */

    const SUPABASE_URL =
      "https://pkznaencgprqzvdzapfi.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable__kretQlB4kdzQp7pyi4opg_Xlf0qsON";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let teachers = [];


    /* =====================================================
       ADMIN CHECK
    ===================================================== */

    async function checkAdmin() {

      try {

        const {
          data: {
            user
          },
          error
        } =
          await supabaseClient.auth.getUser();


        if (error || !user) {

          window.location.href =
            "index.html#admin-login";

          return false;
        }


        const {
          data: adminData,
          error: adminError
        } =
          await supabaseClient
            .from("admins")
            .select("id")
            .eq("id", user.id)
            .maybeSingle();


        if (adminError) {

          console.error(
            "ADMIN CHECK ERROR:",
            adminError
          );

          showStatus(
            "❌ Admin যাচাই করতে সমস্যা হয়েছে।",
            "error"
          );

          return false;
        }


        if (!adminData) {

          await supabaseClient.auth.signOut();

          window.location.href =
            "index.html#admin-login";

          return false;
        }


        return true;

      }

      catch (error) {

        console.error(
          "ADMIN CHECK ERROR:",
          error
        );

        window.location.href =
          "index.html#admin-login";

        return false;
      }

    }


    /* =====================================================
       STATUS MESSAGE
    ===================================================== */

    function showStatus(
      message,
      type = "success"
    ) {

      const status =
        document.getElementById("status");


      status.textContent =
        message;


      status.className =
        type;


      clearTimeout(
        window.statusTimer
      );


      window.statusTimer =
        setTimeout(() => {

          status.textContent = "";
          status.className = "";

        }, 5000);

    }


    /* =====================================================
       LOAD TEACHERS
    ===================================================== */

    async function loadTeachers() {

      const list =
        document.getElementById(
          "teacherList"
        );


      list.innerHTML =
        '<div class="empty">⏳ শিক্ষক তথ্য লোড হচ্ছে...</div>';


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("teachers")
            .select("*")
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (error) {

          throw error;

        }


        teachers =
          data || [];


        renderTeachers(
          teachers
        );

      }

      catch (error) {

        console.error(
          "LOAD TEACHERS ERROR:",
          error
        );


        list.innerHTML =
          '<div class="empty">⚠️ শিক্ষক তথ্য লোড করা যায়নি।</div>';


        showStatus(
          "❌ শিক্ষক তথ্য লোড করতে সমস্যা হয়েছে: " +
          getErrorMessage(error),
          "error"
        );

      }

    }


    /* =====================================================
       RENDER TEACHERS
    ===================================================== */

    function renderTeachers(list) {

      const container =
        document.getElementById(
          "teacherList"
        );


      if (!list || !list.length) {

        container.innerHTML =
          '<div class="empty">👨‍🏫 কোনো শিক্ষক পাওয়া যায়নি।</div>';

        return;
      }


      container.innerHTML =
        list.map(
          teacher => {

            const name =
              teacher.name ||
              "শিক্ষক";


            const initial =
              name.charAt(0);


            const designation =
              teacher.designation ||
              "পদবি উল্লেখ নেই";


            const phone =
              teacher.phone ||
              "মোবাইল নম্বর নেই";


            let date = "";


            if (teacher.created_at) {

              date =
                new Date(
                  teacher.created_at
                ).toLocaleDateString(
                  "bn-BD",
                  {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                  }
                );

            }


            return `

              <article
                class="teacher-card">

                <div class="avatar">

                  ${escapeHtml(initial)}

                </div>


                <div class="teacher-name">

                  ${escapeHtml(name)}

                </div>


                <div class="teacher-info">

                  🎓
                  ${escapeHtml(designation)}

                </div>


                <div class="teacher-info">

                  📱
                  ${escapeHtml(phone)}

                </div>


                ${
                  date
                    ? `
                      <div class="teacher-date">

                        📅 ${escapeHtml(date)}

                      </div>
                    `
                    : ""
                }


                <div class="actions">

                  <button
                    type="button"
                    class="action-btn edit-btn"
                    onclick="editTeacher(${safeJsValue(teacher.id)})">

                    ✏️ Edit

                  </button>


                  <button
                    type="button"
                    class="action-btn delete-btn"
                    onclick="deleteTeacher(${safeJsValue(teacher.id)})">

                    🗑️ Delete

                  </button>

                </div>

              </article>

            `;

          }
        ).join("");

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    function filterTeachers() {

      const input =
        document.getElementById(
          "search"
        );


      const query =
        input.value
          .trim()
          .toLowerCase();


      if (!query) {

        renderTeachers(
          teachers
        );

        return;
      }


      const filtered =
        teachers.filter(
          teacher => {

            const name =
              String(
                teacher.name || ""
              ).toLowerCase();


            const designation =
              String(
                teacher.designation || ""
              ).toLowerCase();


            const phone =
              String(
                teacher.phone || ""
              ).toLowerCase();


            return (
              name.includes(query) ||
              designation.includes(query) ||
              phone.includes(query)
            );

          }
        );


      renderTeachers(
        filtered
      );

    }


    /* =====================================================
       SHOW ADD FORM
    ===================================================== */

    function showAddForm() {

      document.getElementById(
        "formBox"
      ).classList.add("show");


      document.getElementById(
        "formTitle"
      ).textContent =
        "➕ নতুন শিক্ষক যোগ করুন";


      document.getElementById(
        "teacherId"
      ).value = "";


      document.getElementById(
        "name"
      ).value = "";


      document.getElementById(
        "designation"
      ).value = "";


      document.getElementById(
        "phone"
      ).value = "";


      document.getElementById(
        "saveButton"
      ).textContent =
        "💾 সংরক্ষণ করুন";


      document.getElementById(
        "name"
      ).focus();


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =====================================================
       HIDE FORM
    ===================================================== */

    function hideForm() {

      document.getElementById(
        "formBox"
      ).classList.remove(
        "show"
      );


      document.getElementById(
        "teacherId"
      ).value = "";

    }


    /* =====================================================
       SAVE TEACHER
    ===================================================== */

    async function saveTeacher() {

      const id =
        document.getElementById(
          "teacherId"
        ).value.trim();


      const name =
        document.getElementById(
          "name"
        ).value.trim();


      const designation =
        document.getElementById(
          "designation"
        ).value.trim();


      const phone =
        document.getElementById(
          "phone"
        ).value.trim();


      /* -----------------------------
         VALIDATION
      ----------------------------- */

      if (!name) {

        showStatus(
          "⚠️ শিক্ষকের নাম লিখুন।",
          "error"
        );

        document.getElementById(
          "name"
        ).focus();

        return;
      }


      if (!designation) {

        showStatus(
          "⚠️ শিক্ষকের পদবি লিখুন।",
          "error"
        );

        document.getElementById(
          "designation"
        ).focus();

        return;
      }


      const saveButton =
        document.getElementById(
          "saveButton"
        );


      saveButton.disabled =
        true;


      saveButton.textContent =
        "⏳ সংরক্ষণ হচ্ছে...";


      try {

        /* =================================================
           UPDATE EXISTING TEACHER
        ================================================= */

        if (id) {

          const {
            error
          } =
            await supabaseClient
              .from("teachers")
              .update({
                name: name,
                designation: designation,
                phone: phone || null
              })
              .eq(
                "id",
                id
              );


          if (error) {

            throw error;

          }


          showStatus(
            "✅ শিক্ষকের তথ্য সফলভাবে আপডেট হয়েছে।",
            "success"
          );

        }


        /* =================================================
           ADD NEW TEACHER

           ⚠️ এখানে ID পাঠানো হচ্ছে না।

           Database-এর DEFAULT ID নিজে তৈরি করবে।
        ================================================= */

        else {

          const {
            error
          } =
            await supabaseClient
              .from("teachers")
              .insert({
                name: name,
                designation: designation,
                phone: phone || null
              });


          if (error) {

            throw error;

          }


          showStatus(
            "✅ নতুন শিক্ষক সফলভাবে যোগ হয়েছে।",
            "success"
          );

        }


        /* -----------------------------
           RESET FORM
        ----------------------------- */

        hideForm();


        document.getElementById(
          "name"
        ).value = "";


        document.getElementById(
          "designation"
        ).value = "";


        document.getElementById(
          "phone"
        ).value = "";


        /* -----------------------------
           RELOAD
        ----------------------------- */

        await loadTeachers();

      }

      catch (error) {

        console.error(
          "TEACHER SAVE ERROR:",
          error
        );


        showStatus(

    /* =====================================================

    ===================================================== */

    function getErrorMessage(error) {

      if (!error) {

        return "অজানা সমস্যা";

      }


      if (
        error.message &&
        error.message.trim()
      ) {

        return error.message;

      }


      if (
        error.details &&
        error.details.trim()
      ) {

        return error.details;

      }


      if (
        error.hint &&
        error.hint.trim()
      ) {

        return error.hint;

      }


      return "অজানা সমস্যা হয়েছে।";

    }


    /* =====================================================
       HTML SECURITY
    ===================================================== */

    function escapeHtml(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       SAFE JAVASCRIPT VALUE
    ===================================================== */

    function safeJsValue(value) {

      if (
        typeof value === "number"
      ) {

        return String(value);

      }


      if (
        value === null ||
        value === undefined
      ) {

        return "null";

      }


      return "'" +
        String(value)
          .replace(
            /\\/g,
            "\\\\"
          )
          .replace(
            /'/g,
            "\\'"
          )
          .replace(
            /"/g,
            '\\"'
          )
        +
        "'";

    }
