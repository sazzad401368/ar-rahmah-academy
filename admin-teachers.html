```html
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Teacher Management | Ar-Rahmah Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #087443;
      --dark: #055c35;

      }
    }
  </style>
</head>

<body>

  <!-- Loading -->
  <div id="loading">
    <div class="loader">
      <div class="spinner"></div>

      <p>
        Admin যাচাই করা হচ্ছে...
      </p>
    </div>
  </div>


  <!-- Header -->
  <header>

    <h1>
      👨‍🏫 Teacher Management
    </h1>

    <p>
      আর রহমাহ ইন্টারন্যাশনাল নূরানী একাডেমি
    </p>

  </header>


  <main class="container">

    <!-- Top Bar -->
    <div class="top-bar">

      <button
        class="btn back-btn"
        onclick="goDashboard()">

        ← Admin Dashboard

      </button>


      <button
        class="btn add-btn"
        onclick="showAddForm()">

        ➕ নতুন শিক্ষক

      </button>

    </div>


    <!-- Status -->
    <div id="status"></div>


    <!-- Form -->
    <section
      id="formBox"
      class="form-box">

      <h2 id="formTitle">
        ➕ নতুন শিক্ষক যোগ করুন
      </h2>


      <input
        type="hidden"
        id="teacherId">


      <div class="form-group">

        <label for="name">
          👤 শিক্ষকের নাম
        </label>

        <input
          type="text"
          id="name"
          placeholder="শিক্ষকের নাম লিখুন">

      </div>


      <div class="form-group">

        <label for="designation">
          🎓 পদবি
        </label>

        <input
          type="text"
          id="designation"
          placeholder="যেমন: প্রধান শিক্ষক">

      </div>


      <div class="form-group">

        <label for="phone">
          📱 মোবাইল নম্বর
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="মোবাইল নম্বর লিখুন">

      </div>


      <div class="form-actions">

        <button
          class="btn save-btn"
          onclick="saveTeacher()">

          💾 সংরক্ষণ করুন

        </button>


        <button
          class="btn cancel-btn"
          onclick="hideForm()">

          বাতিল

        </button>

      </div>

    </section>


    <!-- Search -->
    <div class="search-box">

      <input
        type="search"
        id="search"
        placeholder="🔎 শিক্ষকের নাম বা পদবি দিয়ে খুঁজুন..."
        oninput="filterTeachers()">

    </div>


    <h2 class="section-title">
      📋 সকল শিক্ষক
    </h2>


    <!-- Teacher List -->
    <section
      id="teacherList"
      class="teacher-list">
    </section>

  </main>


  <script>

    /* ===================================
       SUPABASE
    =================================== */

    const SUPABASE_URL =
      "https://pkznaencgprqzvdzapfi.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable__kretQlB4kdzQp7pyi4opg_Xlf0qsON";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let teachers = [];


    /* ===================================
       ADMIN CHECK
    =================================== */

    async function checkAdmin() {

      try {

        const {
          data: { user },
          error
        } =
          await supabaseClient.auth.getUser();


        if (error || !user) {

          window.location.href =
            "index.html#admin-login";

          return false;
        }


        const {
          data: adminData,
          error: adminError
        } =
          await supabaseClient
            .from("admins")
            .select("id")
            .eq("id", user.id)
            .maybeSingle();


        if (adminError || !adminData) {

          console.error(
            "ADMIN CHECK ERROR:",
            adminError
          );

          await supabaseClient.auth.signOut();

          window.location.href =
            "index.html#admin-login";

          return false;
        }


        return true;

      } catch (error) {

        console.error(
          "ADMIN CHECK ERROR:",
          error
        );

        window.location.href =
          "index.html#admin-login";

        return false;
      }

    }


    /* ===================================
       STATUS
    =================================== */

    function showStatus(
      message,
      type = "success"
    ) {

      const status =
        document.getElementById("status");

      status.textContent =
        message;

      status.className =
        type === "error"
          ? "error"
          : "success";


      setTimeout(() => {

        status.textContent = "";
        status.className = "";

      }, 5000);

    }


    /* ===================================
       LOAD TEACHERS
    =================================== */

    async function loadTeachers() {

      const list =
        document.getElementById(
          "teacherList"
        );


      list.innerHTML =
        '<div class="empty">⏳ শিক্ষক তথ্য লোড হচ্ছে...</div>';


      const {
        data,
        error
      } =
        await supabaseClient
          .from("teachers")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(
          "LOAD TEACHERS ERROR:",
          error
        );

        list.innerHTML =
          '<div class="empty">⚠️ শিক্ষক তথ্য লোড করা যায়নি।</div>';

        showStatus(
          "❌ শিক্ষক তথ্য লোড করতে সমস্যা হয়েছে: " +
          (error.message || "Unknown error"),
          "error"
        );

        return;
      }


      teachers =
        data || [];


      renderTeachers(
        teachers
      );

    }


    /* ===================================
       RENDER TEACHERS
    =================================== */

    function renderTeachers(list) {

      const container =
        document.getElementById(
          "teacherList"
        );


      if (!list.length) {

        container.innerHTML =
          '<div class="empty">👨‍🏫 কোনো শিক্ষক পাওয়া যায়নি।</div>';

        return;
      }


      container.innerHTML =
        list.map(teacher => {

          const name =
            teacher.name ||
            "শিক্ষক";


          const initial =
            name.charAt(0);


          const date =
            teacher.created_at
              ? new Date(
                  teacher.created_at
                ).toLocaleDateString(
                  "bn-BD",
                  {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                  }
                )
              : "";


          return `

            <article class="teacher-card">

              <div class="avatar">
                ${escapeHtml(initial)}
              </div>

              <div class="teacher-name">
                ${escapeHtml(name)}
              </div>

              <div class="teacher-info">
                🎓 ${
                  escapeHtml(
                    teacher.designation ||
                    "পদবি উল্লেখ নেই"
                  )
                }
              </div>

              <div class="teacher-info">
                📱 ${
                  escapeHtml(
                    teacher.phone ||
                    "মোবাইল নম্বর নেই"
                  )
                }
              </div>

              <div class="teacher-date">
                📅 ${date}
              </div>

              <div class="actions">

                <button
                  class="action-btn edit-btn"
                  onclick="editTeacher('${escapeJs(teacher.id)}')">

                  ✏️ Edit

                </button>


                <button
                  class="action-btn delete-btn"
                  onclick="deleteTeacher('${escapeJs(teacher.id)}')">

                  🗑️ Delete

                </button>

              </div>

            </article>

          `;

        }).join("");

    }


    /* ===================================
       SEARCH
    =================================== */

    function filterTeachers() {

      const query =
        document.getElementById(
          "search"
        ).value
          .trim()
          .toLowerCase();


      if (!query) {

        renderTeachers(
          teachers
        );

        return;
      }


      const filtered =
        teachers.filter(
          teacher => {

            const name =
              String(
                teacher.name || ""
              ).toLowerCase();


            const designation =
              String(
                teacher.designation || ""
              ).toLowerCase();


            const phone =
              String(
                teacher.phone || ""
              ).toLowerCase();


            return (
              name.includes(query) ||
              designation.includes(query) ||
              phone.includes(query)
            );

          }
        );


      renderTeachers(
        filtered
      );

    }


    /* ===================================
       ADD FORM
    =================================== */

    function showAddForm() {

      document.getElementById(
        "formBox"
      ).classList.add("show");


      document.getElementById(
        "formTitle"
      ).textContent =
        "➕ নতুন শিক্ষক যোগ করুন";


      document.getElementById(
        "teacherId"
      ).value = "";


      document.getElementById(
        "name"
      ).value = "";


      document.getElementById(
        "designation"
      ).value = "";


      document.getElementById(
        "phone"
      ).value = "";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* ===================================
       HIDE FORM
    =================================== */

    function hideForm() {

      document.getElementById(
        "formBox"
      ).classList.remove(
        "show"
      );

    }


    /* ===================================
       SAVE TEACHER
    =================================== */

    async function saveTeacher() {

      const id =
        document.getElementById(
          "teacherId"
        ).value;


      const name =
        document.getElementById(
          "name"
        ).value.trim();


      const designation =
        document.getElementById(
          "designation"
        ).value.trim();


      const phone =
        document.getElementById(
          "phone"
        ).value.trim();


      if (!name) {

        showStatus(
          "⚠️ শিক্ষকের নাম লিখুন।",
          "error"
        );

        return;
      }


      if (!designation) {

        showStatus(
          "⚠️ শিক্ষকের পদবি লিখুন।",
          "error"
        );

        return;
      }


      try {

        /* =============================
           UPDATE EXISTING TEACHER
        ============================= */

        if (id) {

          const {
            error
          } =
            await supabaseClient
              .from("teachers")
              .update({
                name: name,
                designation: designation,
                phone: phone
              })
              .eq("id", id);


          if (error) {

            throw error;

          }


          showStatus(
            "✅ শিক্ষকের তথ্য আপডেট হয়েছে।"
          );

        }


        /* =============================
           ADD NEW TEACHER
        ============================= */

        else {

          const newTeacherId =
            crypto.randomUUID();


          const {
            error
          } =
            await supabaseClient
              .from("teachers")
              .insert({
                id: newTeacherId,
                name: name,
                designation: designation,
                phone: phone
              });


          if (error) {

            throw error;

          }


          showStatus(
            "✅ নতুন শিক্ষক যোগ হয়েছে।"
          );

        }


        hideForm();

        await loadTeachers();


      } catch (error) {

        console.error(
          "TEACHER SAVE ERROR:",
          error
        );


        showStatus(
          "❌ তথ্য সংরক্ষণ করা যায়নি: " +
          (
            error.message ||
            "Unknown error"
          ),
          "error"
        );

      }

    }


    /* ===================================
       EDIT
    =================================== */

    async function editTeacher(id) {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("teachers")
          .select("*")
          .eq("id", id)
          .maybeSingle();


      if (error || !data) {

        console.error(
          "EDIT TEACHER ERROR:",
          error
        );

        showStatus(
          "❌ শিক্ষকের তথ্য পাওয়া যায়নি।",
          "error"
        );

        return;
      }


      document.getElementById(
        "teacherId"
      ).value =
        data.id || "";


      document.getElementById(
        "name"
      ).value =
        data.name || "";


      document.getElementById(
        "designation"
      ).value =
        data.designation || "";


      document.getElementById(
        "phone"
      ).value =
        data.phone || "";


      document.getElementById(
        "formTitle"
      ).textContent =
        "✏️ শিক্ষকের তথ্য পরিবর্তন করুন";


      document.getElementById(
        "formBox"
      ).classList.add("show");


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* ===================================
       DELETE
    =================================== */

    async function deleteTeacher(id) {

      const confirmed =
        confirm(
          "আপনি কি এই শিক্ষকের তথ্য মুছে ফেলতে চান?"
        );


      if (!confirmed) {

        return;

      }


      try {

        const {
          error
        } =
          await supabaseClient
            .from("teachers")
            .delete()
            .eq("id", id);


        if (error) {

          throw error;

        }


        showStatus(
          "🗑️ শিক্ষক সফলভাবে মুছে ফেলা হয়েছে।"
        );


        await loadTeachers();


      } catch (error) {

        console.error(
          "DELETE TEACHER ERROR:",
          error
        );


        showStatus(
          "❌ শিক্ষক মুছে ফেলা যায়নি: " +
          (
            error.message ||
            "Unknown error"
          ),
          "error"
        );

      }

    }


    /* ===================================
       HTML SECURITY
    =================================== */

    function escapeHtml(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ===================================
       JAVASCRIPT SECURITY
    =================================== */

    function escapeJs(value) {

      return String(value)
        .replace(
          /\\/g,
          "\\\\"
        )
        .replace(
          /'/g,
          "\\'"
        )
        .replace(
          /"/g,
          '\\"'
        );

    }


    /* ===================================
       DASHBOARD
    =================================== */

    function goDashboard() {

      window.location.href =
        "admin.html";

    }


    /* ===================================
       INITIALIZE
    =================================== */

    async function initialize() {

      const isAdmin =
        await checkAdmin();


      if (!isAdmin) {

        return;

      }


      await loadTeachers();


      document.getElementById(
        "loading"
      ).style.display =
        "none";

    }


    /* START */

    initialize();

  </script>

</body>
</html>
```
