  <style>
    * {

    .container {

      align-items: center;

    .box {

      gap: 15px;
    }

    input {
      width: 100%;

    }

      outline: none;

    }

    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .save-btn,
    .update-btn,
    .cancel-btn {
      padding: 12px 25px;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    .save-btn {
      background: #087443;
    }

    .save-btn:hover {
      background: #065c36;
    }

    .update-btn {
      background: #2563eb;
    }

    .update-btn:hover {
      background: #1d4ed8;
    }

    .cancel-btn {
      background: #777;
    }

    .cancel-btn:hover {
      background: #555;
    }

    #message {
      margin-top: 12px;
      font-weight: bold;
    }

    .search-box {
      margin-bottom: 18px;
    }

    .search-box input {
      max-width: 500px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #087443;
      color: white;
    }

    tr:nth-child(even) {
      background: #f8faf9;
    }

    .edit-btn,
    .delete-btn {
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 5px;
      cursor: pointer;
      margin: 2px;
    }

    .edit-btn {
      background: #2563eb;
    }

    .edit-btn:hover {
      background: #1d4ed8;
    }

    .delete-btn {
      background: #b42318;
    }

    .delete-btn:hover {
      background: #991b1b;
    }

    #loading {
      text-align: center;
      padding: 15px;
      color: #666;
    }

    .editing {
      border: 2px solid #2563eb;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 20px;
      }

      .container {
        padding: 20px 12px;
      }

      .box {
        padding: 18px;
      }

      .save-btn,
      .update-btn,
      .cancel-btn {
        width: 100%;
      }
    }
  </style>

</head>

<body>

  </div>

<script>


  // =====================================
  // SUPABASE CONNECTION
  // =====================================

  const SUPABASE_URL =
    "https://pkznaencgprqzvdzapfi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable__kretQlB4kdzQp7pyi4opg_Xlf0qsON";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // সব Student এখানে রাখা হবে

  let allStudents = [];


  // বর্তমানে কোন Student Edit হচ্ছে

  let editingStudentId = null;



  // =====================================
  // CHECK ADMIN
  // =====================================

  async function checkAdmin() {

    const {
      data: { user }
    } =
      await supabaseClient.auth.getUser();


    if (!user) {

      window.location.href =
        "index.html#admin-login";

      return false;

    }


    const {
      data: adminData,
      error
    } =
      await supabaseClient
        .from("admins")
        .select("id")
        .eq("id", user.id)
        .maybeSingle();


    if (error || !adminData) {

      await supabaseClient.auth.signOut();

      window.location.href =
        "index.html#admin-login";

      return false;

    }


    return true;

  }



  // =====================================
  // LOAD STUDENTS
  // =====================================

  async function loadStudents() {

    const allowed =
      await checkAdmin();


    if (!allowed) return;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("students")
        .select(
          "id, name, class_name, roll"
        )
        .order("id", {
          ascending: true
        });


    const table =
      document.getElementById(
        "studentTable"
      );


    const loading =
      document.getElementById(
        "loading"
      );


    loading.style.display =
      "none";


    if (error) {

      console.error(error);

      table.innerHTML =
        `
        <tr>
          <td colspan="5">
            ❌ তথ্য লোড করা যায়নি।
            <br>
            ${error.message}
          </td>
        </tr>
        `;

      return;

    }


    allStudents =
      data || [];


    displayStudents(allStudents);

  }



  // =====================================
  // DISPLAY STUDENTS
  // =====================================

  function displayStudents(students) {

    const table =
      document.getElementById(
        "studentTable"
      );


    if (!students || students.length === 0) {

      table.innerHTML =
        `
        <tr>
          <td colspan="5">
            কোনো শিক্ষার্থী পাওয়া যায়নি।
          </td>
        </tr>
        `;

      return;

    }


    table.innerHTML = "";


    students.forEach(student => {

      const row =
        document.createElement("tr");


      row.innerHTML = `

        <td>${escapeHTML(student.id ?? "")}</td>

        <td>${escapeHTML(student.name ?? "")}</td>

        <td>${escapeHTML(student.class_name ?? "")}</td>

        <td>${escapeHTML(student.roll ?? "")}</td>

        <td>

          <button
            class="edit-btn"
            onclick="editStudent('${escapeJS(student.id)}')"
          >
            ✏️ Edit
          </button>

          <button
            class="delete-btn"
            onclick="deleteStudent('${escapeJS(student.id)}')"
          >
            🗑️ Delete
          </button>

        </td>

      `;


      table.appendChild(row);

    });

  }



  // =====================================
  // SEARCH / FILTER
  // =====================================

  function filterStudents() {

    const search =
      document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    if (!search) {

      displayStudents(allStudents);

      return;

    }


    const filtered =
      allStudents.filter(student => {

        return (

          String(student.id ?? "")
            .toLowerCase()
            .includes(search)

          ||

          String(student.name ?? "")
            .toLowerCase()
            .includes(search)

          ||

          String(student.class_name ?? "")
            .toLowerCase()
            .includes(search)

          ||

          String(student.roll ?? "")
            .toLowerCase()
            .includes(search)

        );

      });


    displayStudents(filtered);

  }



  // =====================================
  // ADD STUDENT
  // =====================================

  async function addStudent() {

    const student_id =
      document
        .getElementById("student_id")
        .value
        .trim();


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const class_name =
      document
        .getElementById("class_name")
        .value
        .trim();


    const roll =
      document
        .getElementById("roll")
        .value
        .trim();


    const message =
      document.getElementById(
        "message"
      );


    if (
      !student_id ||
      !name ||
      !class_name ||
      !roll
    ) {

      message.textContent =
        "⚠️ Student ID, নাম, শ্রেণি ও রোল—সবগুলো দিতে হবে।";

      return;

    }


    message.textContent =
      "⏳ সংরক্ষণ হচ্ছে...";


    // Duplicate check

    const {
      data: existingStudent,
      error: checkError
    } =
      await supabaseClient
        .from("students")
        .select("id")
        .eq("id", student_id)
        .maybeSingle();


    if (checkError) {

      message.textContent =
        "❌ যাচাই করা যায়নি: " +
        checkError.message;

      return;

    }


    if (existingStudent) {

      message.textContent =
        "❌ এই Student ID আগে থেকেই আছে। অন্য ID দিন।";

      return;

    }


    // Insert

    const {
      error
    } =
      await supabaseClient
        .from("students")
        .insert([
          {
            id: student_id,
            name: name,
            class_name: class_name,
            roll: roll
          }
        ]);


    if (error) {

      message.textContent =
        "❌ সংরক্ষণ ব্যর্থ: " +
        error.message;

      return;

    }


    message.textContent =
      "✅ শিক্ষার্থী সফলভাবে যোগ হয়েছে।";


    clearForm();

    await loadStudents();

  }



  // =====================================
  // EDIT STUDENT
  // =====================================

  function editStudent(id) {

    const student =
      allStudents.find(
        s => String(s.id) === String(id)
      );


    if (!student) {

      alert(
        "❌ শিক্ষার্থীর তথ্য পাওয়া যায়নি।"
      );

      return;

    }


    editingStudentId =
      student.id;


    document.getElementById(
      "student_id"
    ).value =
      student.id ?? "";


    document.getElementById(
      "name"
    ).value =
      student.name ?? "";


    document.getElementById(
      "class_name"
    ).value =
      student.class_name ?? "";


    document.getElementById(
      "roll"
    ).value =
      student.roll ?? "";


    // Student ID Edit-এর সময় পরিবর্তন করা যাবে না

    document.getElementById(
      "student_id"
    ).disabled = true;


    document.getElementById(
      "formTitle"
    ).textContent =
      "✏️ শিক্ষার্থীর তথ্য পরিবর্তন করুন";


    document.getElementById(
      "saveButton"
    ).style.display =
      "none";


    document.getElementById(
      "updateButton"
    ).style.display =
      "inline-block";


    document.getElementById(
      "cancelButton"
    ).style.display =
      "inline-block";


    document.getElementById(
      "message"
    ).textContent =
      "✏️ তথ্য পরিবর্তন করে 'পরিবর্তন সংরক্ষণ করুন' চাপুন।";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }



  // =====================================
  // UPDATE STUDENT
  // =====================================

  async function updateStudent() {

    if (editingStudentId === null) {

      return;

    }


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const class_name =
      document
        .getElementById("class_name")
        .value
        .trim();


    const roll =
      document
        .getElementById("roll")
        .value
        .trim();


    const message =
      document.getElementById(
        "message"
      );


    if (
      !name ||
      !class_name ||
      !roll
    ) {

      message.textContent =
        "⚠️ নাম, শ্রেণি ও রোল দিতে হবে।";

      return;

    }


    message.textContent =
      "⏳ পরিবর্তন সংরক্ষণ হচ্ছে...";


    const {
      error
    } =
      await supabaseClient
        .from("students")
        .update({
          name: name,
          class_name: class_name,
          roll: roll
        })
        .eq(
          "id",
          editingStudentId
        );


    if (error) {

      message.textContent =
        "❌ পরিবর্তন সংরক্ষণ ব্যর্থ: " +
        error.message;

      return;

    }


    message.textContent =
      "✅ শিক্ষার্থীর তথ্য সফলভাবে পরিবর্তন হয়েছে।";


    cancelEdit();

    await loadStudents();

  }



  // =====================================
  // CANCEL EDIT
  // =====================================

  function cancelEdit() {

    editingStudentId = null;


    document.getElementById(
      "student_id"
    ).disabled = false;


    document.getElementById(
      "formTitle"
    ).textContent =
      "➕ নতুন শিক্ষার্থী যোগ করুন";


    document.getElementById(
      "saveButton"
    ).style.display =
      "inline-block";


    document.getElementById(
      "updateButton"
    ).style.display =
      "none";


    document.getElementById(
      "cancelButton"
    ).style.display =
      "none";


    clearForm();

  }



  // =====================================
  // DELETE STUDENT
  // =====================================

  async function deleteStudent(id) {

    const confirmed =
      confirm(
        "এই শিক্ষার্থীকে মুছে ফেলতে চান?"
      );


    if (!confirmed) return;


    const {
      error
    } =
      await supabaseClient
        .from("students")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      alert(
        "❌ মুছে ফেলা যায়নি: " +
        error.message
      );

      return;

    }


    alert(
      "✅ শিক্ষার্থী মুছে ফেলা হয়েছে।"
    );


    await loadStudents();

  }



  // =====================================
  // CLEAR FORM
  // =====================================

  function clearForm() {

    document.getElementById(
      "student_id"
    ).value = "";


    document.getElementById(
      "name"
    ).value = "";


    document.getElementById(
      "class_name"
    ).value = "";


    document.getElementById(
      "roll"
    ).value = "";

  }



  // =====================================
  // SECURITY HELPERS
  // =====================================

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeJS(value) {

    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");

  }



  // =====================================
  // START
  // =====================================

  loadStudents();


</script>

</body>
</html>
