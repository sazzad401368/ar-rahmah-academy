<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Students Management - Ar-Rahmah Academy</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #222;
    }

    header {
      background: #087443;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .top-bar h2 {
      color: #087443;
    }

    .back-btn {
      background: #555;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .box h2 {
      color: #087443;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .save-btn {
      margin-top: 18px;
      padding: 12px 25px;
      background: #087443;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    .save-btn:hover {
      background: #065c36;
    }

    #message {
      margin-top: 12px;
      font-weight: bold;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 550px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #087443;
      color: white;
    }

    .delete-btn {
      background: #b42318;
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #991b1b;
    }

    #loading {
      text-align: center;
      padding: 15px;
      color: #666;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 20px;
      }

      .container {
        padding: 20px 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>👨‍🎓 Students Management</h1>
    <p>আর রহমাহ ইন্টারন্যাশনাল নূরানী একাডেমি</p>
  </header>


  <div class="container">

    <div class="top-bar">

      <h2>শিক্ষার্থী পরিচালনা</h2>

      <a href="admin.html" class="back-btn">
        ← Admin Panel
      </a>

    </div>


    <!-- Add Student -->

    <div class="box">

      <h2>➕ নতুন শিক্ষার্থী যোগ করুন</h2>

      <div class="form-grid">

        <input
          type="text"
          id="name"
          placeholder="শিক্ষার্থীর নাম"
        >

        <input
          type="text"
          id="class_name"
          placeholder="শ্রেণি"
        >

        <input
          type="number"
          id="roll"
          placeholder="রোল নম্বর"
        >

      </div>


      <button
        class="save-btn"
        onclick="addStudent()"
      >
        💾 শিক্ষার্থী সংরক্ষণ করুন
      </button>


      <div id="message"></div>

    </div>


    <!-- Student List -->

    <div class="box">

      <h2>📋 শিক্ষার্থী তালিকা</h2>

      <div id="loading">
        শিক্ষার্থীদের তথ্য লোড হচ্ছে...
      </div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>
              <th>ID</th>
              <th>নাম</th>
              <th>শ্রেণি</th>
              <th>রোল</th>
              <th>Action</th>
            </tr>

          </thead>


          <tbody id="studentTable">
          </tbody>

        </table>

      </div>

    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://pkznaencgprqzvdzapfi.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable__kretQlB4kdzQp7pyi4opg_Xlf0qsON";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // =========================
    // Check Admin
    // =========================

    async function checkAdmin() {

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();


      if (!user) {

        window.location.href =
          "index.html#admin-login";

        return false;
      }


      const {
        data: adminData,
        error
      } =
        await supabaseClient
          .from("admins")
          .select("id")
          .eq("id", user.id)
          .maybeSingle();


      if (error || !adminData) {

        await supabaseClient.auth.signOut();

        window.location.href =
          "index.html#admin-login";

        return false;
      }


      return true;
    }


    // =========================
    // Load Students
    // =========================

    async function loadStudents() {

      const allowed =
        await checkAdmin();


      if (!allowed) return;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("students")
          .select("id, name, class_name, roll")
          .order("id", {
            ascending: true
          });


      const table =
        document.getElementById(
          "studentTable"
        );


      const loading =
        document.getElementById(
          "loading"
        );


      loading.style.display =
        "none";


      if (error) {

        table.innerHTML =
          `<tr>
            <td colspan="5">
              ❌ তথ্য লোড করা যায়নি।
            </td>
          </tr>`;

        return;
      }


      if (!data || data.length === 0) {

        table.innerHTML =
          `<tr>
            <td colspan="5">
              এখনো কোনো শিক্ষার্থী যোগ করা হয়নি।
            </td>
          </tr>`;

        return;
      }


      table.innerHTML = "";


      data.forEach(student => {

        const row =
          document.createElement("tr");


        row.innerHTML = `

          <td>${student.id ?? ""}</td>

          <td>${student.name ?? ""}</td>

          <td>${student.class_name ?? ""}</td>

          <td>${student.roll ?? ""}</td>

          <td>

            <button
              class="delete-btn"
              onclick="deleteStudent(${student.id})"
            >
              Delete
            </button>

          </td>

        `;


        table.appendChild(row);

      });

    }


    // =========================
    // Add Student
    // =========================

    async function addStudent() {

      const name =
        document.getElementById(
          "name"
        ).value.trim();


      const class_name =
        document.getElementById(
          "class_name"
        ).value.trim();


      const roll =
        document.getElementById(
          "roll"
        ).value.trim();


      const message =
        document.getElementById(
          "message"
        );


      if (!name || !class_name || !roll) {

        message.textContent =
          "⚠️ নাম, শ্রেণি ও রোল অবশ্যই দিতে হবে।";

        return;
      }


      message.textContent =
        "⏳ সংরক্ষণ হচ্ছে...";


      const {
        error
      } =
        await supabaseClient
          .from("students")
          .insert([
            {
              name: name,
              class_name: class_name,
              roll: Number(roll)
            }
          ]);


      if (error) {

        message.textContent =
          "❌ সংরক্ষণ ব্যর্থ: " +
          error.message;

        return;
      }


      message.textContent =
        "✅ শিক্ষার্থী সফলভাবে যোগ হয়েছে।";


      document.getElementById(
        "name"
      ).value = "";


      document.getElementById(
        "class_name"
      ).value = "";


      document.getElementById(
        "roll"
      ).value = "";


      loadStudents();

    }


    // =========================
    // Delete Student
    // =========================

    async function deleteStudent(id) {

      const confirmed =
        confirm(
          "এই শিক্ষার্থীকে মুছে ফেলতে চান?"
        );


      if (!confirmed) return;


      const {
        error
      } =
        await supabaseClient
          .from("students")
          .delete()
          .eq("id", id);


      if (error) {

        alert(
          "❌ মুছে ফেলা যায়নি: " +
          error.message
        );

        return;
      }


      alert(
        "✅ শিক্ষার্থী মুছে ফেলা হয়েছে।"
      );


      loadStudents();

    }


    // Start

    loadStudents();

  </script>

</body>
</html>
